<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cek Predikat Nilai</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 300px;
    }
    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    #hasil {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h3>Cek Predikat Nilai</h3>
  <input type="number" id="inputNilai">
  <button onclick="hitungPredikat()">Cek Hasil</button>

  <div id="hasil"></div>

  <script>
    function hitungPredikat() {
      const input = document.getElementById("inputNilai").value;
      const nilai = Number(input);
      const elemHasil = document.getElementById("hasil");

      let predikat = "";
      if (nilai >= 90) {
        predikat = "Predikat A";
      } else if (nilai >= 80) {
        predikat = "Predikat B";
      } else if (nilai >= 70) {
        predikat = "Predikat C";
      } else {
        predikat = "Predikat D";
      }

      elemHasil.textContent = predikat;
    }
  </script>

</body>
</html>
