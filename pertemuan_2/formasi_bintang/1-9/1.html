<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 1</title>
</head>
<body>
    <pre id="output"></pre>

<script>
let hasil = "";

hasil += "***********\n";

for (let i = 5; i >= 1; i--) {

    let spasi = 11 - (i * 2);

    hasil += "*".repeat(i);
    hasil += " ".repeat(spasi);
    hasil += "*".repeat(i);
    hasil += "\n";
}

document.getElementById("output").textContent = hasil;
</script>
    
</body>
</html>
