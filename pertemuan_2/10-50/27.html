<!DOCTYPE html>
<html>
<head>
    <title>Soal 27</title>
</head>
<body>

    <h2>Tahun Kabisat Angka Terakhir 6</h2>

    <input type="number" id="awal" placeholder="n_awal">
    <input type="number" id="akhir" placeholder="n_akhir">
    <button onclick="hitung()">Tampilkan</button>

    <p id="hasil"></p>

    <script>
        function hitung() {
            let awal = Number(document.getElementById("awal").value);
            let akhir = Number(document.getElementById("akhir").value);
            let hasil = "";

            if (awal == "" || akhir == "") {
                document.getElementById("hasil").innerHTML = "Input harus diisi!";
                return;
            }

            if (awal > akhir) {
                document.getElementById("hasil").innerHTML =
                    "n_awal tidak boleh lebih besar dari n_akhir!";
                return;
            }

            for (let i = awal; i <= akhir; i++) {
                if (i % 4 == 0 && i % 10 == 6) {
                    hasil += i + " ";
                }
            }

            if (hasil == "") {
                hasil = "Tidak ada tahun kabisat yang sesuai.";
            }

            document.getElementById("hasil").innerHTML = hasil;
        }
    </script>

</body>
</html>
