<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Pola Bintang JS</title>
</head>
<body>
  <h1>Pola Bintang JavaScript</h1>
  
  <pre id="pola"></pre>

  <script>
    const n = 7;
    let hasil = "";

    hasil += "1. Segitiga Siku-Siku\n";
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= i; j++) {
        hasil += "*";
      }
      hasil += "\n";
    }
    hasil += "\n";
    

    hasil += "2. Segitiga Siku-Siku Terbalik\n";
    for (let i = n; i >= 1; i--) {
      for (let j = 1; j <= i; j++) {
        hasil += "*";
      }
      hasil += "\n";
    }
    hasil += "\n";

    hasil += "3. Piramida\n";
    for (let i = 1; i <= n; i++) {
      // Cetak spasi
      for (let j = 1; j <= n - i; j++) {
        hasil += " ";
      }
      // Cetak bintang
      for (let k = 1; k <= 2 * i - 1; k++) {
        hasil += "*";
      }
      hasil += "\n";
    }
    hasil += "\n";

    hasil += "4. Belah Ketupat (Diamond)\n";
    // Bagian Atas
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= n - i; j++) {
        hasil += " ";
      }
      for (let k = 1; k <= 2 * i - 1; k++) {
        hasil += "*";
      }
      hasil += "\n";
    }
    // Bagian Bawah
    for (let i = n - 1; i >= 1; i--) {
      for (let j = 1; j <= n - i; j++) {
        hasil += " ";
      }
      for (let k = 1; k <= 2 * i - 1; k++) {
        hasil += "*";
      }
      hasil += "\n";
    }
    hasil += "\n";

    hasil += "5. Persegi Bolong\n";
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= n; j++) {
        if (i === 1 || i === n || j === 1 || j === n) {
          hasil += "* ";
        } else {
          hasil += "  ";
        }
      }
      hasil += "\n";
    }

    document.getElementById("pola").textContent = hasil;
  </script>
</body>
</html>
